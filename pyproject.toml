[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "steam_monitor"
version = "2.0"
description = "Tool implementing real-time tracking of Steam players activities"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
authors = [{ name = "Michal Szymanski", email = "misiektoja-pypi@rm-rf.ninja" }]
requires-python = ">=3.6"
dependencies = [
  "steam[client]>=1.4.3",
  "requests>=2.0",
  "python-dateutil>=2.8",
  "python-dotenv>=0.19",
  "colorama>=0.4.6; platform_system == 'Windows'",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.6",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
]
keywords = ["steam", "monitoring", "tracking", "real-time", "osint"]

[project.optional-dependencies]
test = [
  "pytest>=7.0",
  "pyyaml>=6.0",
  "Pillow>=8.0,<9.0; python_version < '3.7'",
  "Pillow>=9.0,<10.0; python_version == '3.7'",
  "Pillow>=10.0,<11.0; python_version == '3.8'",
  "Pillow>=11.3.0,<12; python_version == '3.9'",
  "Pillow>=12.0.0; python_version >= '3.10'",
]
# Pinned so a new ruff release cannot fail CI on a rule that did not exist when the change was written
lint = ["ruff==0.16.4"]
# Each Pillow major dropped an older Python, so every supported version pins the newest release that still supports it
ntfy-images = [
  "Pillow>=8.0,<9.0; python_version < '3.7'",
  "Pillow>=9.0,<10.0; python_version == '3.7'",
  "Pillow>=10.0,<11.0; python_version == '3.8'",
  "Pillow>=11.3.0,<12; python_version == '3.9'",
  "Pillow>=12.0.0; python_version >= '3.10'",
]

[project.urls]
Homepage = "https://github.com/misiektoja/steam_monitor"
Source   = "https://github.com/misiektoja/steam_monitor"
Changelog= "https://github.com/misiektoja/steam_monitor/blob/main/RELEASE_NOTES.md"

[project.scripts]
steam_monitor = "steam_monitor:main"

[tool.setuptools]
py-modules = ["steam_monitor"]
include-package-data = true

[tool.ruff.lint]
# Defect rules only: syntax errors, pyflakes and bugbear. Formatting and import order are left
# to the surrounding code, which keeps each function definition on one physical line.
# The target version is taken from requires-python, which is below the oldest ruff can be told about
select = ["E9", "F", "B"]
# Both are style preferences that would rewrite hundreds of existing lines without fixing a defect
ignore = ["F541", "B904"]

[tool.pytest.ini_options]
# Run the in-repo source, never an installed copy, by putting the project root first on sys.path
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
