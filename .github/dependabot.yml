version: 2
updates:
  # GitHub Actions used in .github/workflows/*.yml (auto-discovered)
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # Python runtime, test and lint dependencies declared in pyproject.toml
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Each Python version pins the newest Pillow major that still supports it, so those caps are maintained by hand
    # Pillow is declared only as ranges, so Dependabot cannot classify an update type and would widen every cap
    ignore:
      - dependency-name: "pillow"
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build"
